<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="60%" stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <g stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 65H1000M0 130H1000M0 195H1000"/>
    <path d="M125 0V260M250 0V260M375 0V260M500 0V260M625 0V260M750 0V260M875 0V260"/>
  </g>

  <g fill="none" stroke="url(#slash)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M60 20 L260 240" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0;320" keyTimes="0;0.15;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M110 10 L320 235" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.05;0.2;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M160 5 L380 230" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.1;0.25;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M940 240 L740 20" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.15;0.3;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M890 250 L690 30" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.2;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <path d="M430 38 L480 50 L440 56 Z">
      <animate attributeName="opacity" values="0;0;1;1;0.2;1;0" keyTimes="0;0.2;0.3;0.7;0.75;0.8;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M570 38 L520 50 L560 56 Z">
      <animate attributeName="opacity" values="0;0;1;1;0.2;1;0" keyTimes="0;0.2;0.3;0.7;0.75;0.8;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#title)" filter="url(#glow)">
    HI, I'M KISHAN GURAV
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="2s" fill="freeze"/>
  </text>

  <rect x="200" y="148" width="600" height="3" fill="url(#sweep)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="185" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#c4b5fd">
    AI/ML ENGINEER  &#8226;  FULL STACK DEVELOPER  &#8226;  BLOCKCHAIN ENTHUSIAST
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.4;1" dur="3s" fill="freeze"/>
  </text>

  <text x="500" y="225" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" letter-spacing="8" fill="#ffffff" fill-opacity="0.5">
    WAKANDA FOREVER
    <animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
  </text>

  <g fill="#a78bfa" filter="url(#glow)">
    <circle cx="80" cy="250" r="2"><animate attributeName="cy" values="260;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="250" r="1.5"><animate attributeName="cy" values="260;-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="250" r="2.5"><animate attributeName="cy" values="260;-10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="250" r="1.5"><animate attributeName="cy" values="260;-10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="2"><animate attributeName="cy" values="260;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="250" r="2.5"><animate attributeName="cy" values="260;-10" dur="8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="250" r="1.5"><animate attributeName="cy" values="260;-10" dur="7s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="250" r="2"><animate attributeName="cy" values="260;-10" dur="9s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
