<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1e0d38"/>
      <stop offset="55%" stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="titleclip">
      <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="54" font-weight="900" letter-spacing="5">HI, I'M KISHAN GURAV</text>
    </clipPath>
    <clipPath id="subclip">
      <rect x="0" y="160" width="0" height="36">
        <animate attributeName="width" values="0;1000;1000;0" keyTimes="0;0.25;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <ellipse cx="200" cy="90" rx="260" ry="55" fill="#7c3aed" opacity="0.4" filter="url(#soft)">
    <animate attributeName="cx" values="200;800;200" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="800" cy="230" rx="260" ry="50" fill="#4c1d95" opacity="0.55" filter="url(#soft)">
    <animate attributeName="cx" values="800;200;800" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#7c3aed" stroke-opacity="0.16" stroke-width="1">
    <path d="M125 0V280M250 0V280M375 0V280M500 0V280M625 0V280M750 0V280M875 0V280"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 40" dur="3s" repeatCount="indefinite"/>
      <path d="M0 -40H1000M0 0H1000M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000M0 280H1000"/>
    </g>
  </g>

  <g fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
    <circle cx="500" cy="140" r="125" stroke-dasharray="6 14">
      <animateTransform attributeName="transform" type="rotate" values="0 500 140;360 500 140" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="140" r="100" stroke-dasharray="30 10 4 10" stroke="#c4b5fd">
      <animateTransform attributeName="transform" type="rotate" values="360 500 140;0 500 140" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke="url(#slash)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="360" stroke-dashoffset="360">
    <path d="M50 15 L270 265"><animate attributeName="stroke-dashoffset" values="360;0;0;360" keyTimes="0;0.12;0.85;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M105 8 L325 258"><animate attributeName="stroke-dashoffset" values="360;360;0;0;360" keyTimes="0;0.05;0.17;0.85;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M160 3 L380 250"><animate attributeName="stroke-dashoffset" values="360;360;0;0;360" keyTimes="0;0.1;0.22;0.85;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M950 265 L730 15"><animate attributeName="stroke-dashoffset" values="360;360;0;0;360" keyTimes="0;0.15;0.27;0.85;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M895 272 L675 22"><animate attributeName="stroke-dashoffset" values="360;360;0;0;360" keyTimes="0;0.2;0.32;0.85;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M840 277 L620 27"><animate attributeName="stroke-dashoffset" values="360;360;0;0;360" keyTimes="0;0.25;0.37;0.85;1" dur="8s" repeatCount="indefinite"/></path>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <polygon points="425,34 478,48 436,56"/>
    <polygon points="575,34 522,48 564,56"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <g font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="54" font-weight="900" letter-spacing="5" text-anchor="middle">
    <text x="500" y="140" fill="#7c3aed" opacity="0">
      HI, I'M KISHAN GURAV
      <animate attributeName="opacity" values="0;0;0.8;0;0.6;0;0" keyTimes="0;0.7;0.71;0.72;0.73;0.74;1" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 0;5 0;0 0" keyTimes="0;0.5;0.8;1" dur="0.4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="140" fill="#e9d5ff" opacity="0">
      HI, I'M KISHAN GURAV
      <animate attributeName="opacity" values="0;0;0.7;0;0.5;0;0" keyTimes="0;0.7;0.715;0.725;0.735;0.745;1" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;-5 0;0 0" keyTimes="0;0.5;0.8;1" dur="0.4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="140" fill="url(#title)" filter="url(#glow)">
      HI, I'M KISHAN GURAV
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="2s" fill="freeze"/>
    </text>
  </g>

  <g clip-path="url(#titleclip)">
    <rect x="-200" y="80" width="160" height="80" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1100;1100" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="180" y="152" width="640" height="3" fill="url(#beam)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="180" cy="153.5" r="4" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="180;820;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#subclip)">
    <text x="500" y="185" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#c4b5fd">AI/ML ENGINEER  &#8226;  FULL STACK DEVELOPER  &#8226;  BLOCKCHAIN ENTHUSIAST</text>
  </g>

  <text x="500" y="250" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" letter-spacing="10" fill="#ffffff" fill-opacity="0.5" filter="url(#glow)">
    WAKANDA FOREVER
    <animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <g fill="#c4b5fd" filter="url(#glow)">
    <circle cx="70" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="280" r="2.5"><animate attributeName="cy" values="290;-10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="280" r="2.5"><animate attributeName="cy" values="290;-10" dur="8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="7s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="9s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="6s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="280" r="2.5"><animate attributeName="cy" values="290;-10" dur="8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
