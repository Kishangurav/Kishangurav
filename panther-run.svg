<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220">
  <defs>
    <pattern id="dim" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="14" rx="3" fill="#1a1426"/>
    </pattern>
    <pattern id="lit" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="14" rx="3" fill="#5b21b6"/>
    </pattern>
    <pattern id="hot" width="140" height="60" patternUnits="userSpaceOnUse">
      <rect x="23" y="3" width="14" height="14" rx="3" fill="#a78bfa"/>
      <rect x="83" y="23" width="14" height="14" rx="3" fill="#c4b5fd"/>
      <rect x="123" y="43" width="14" height="14" rx="3" fill="#7c3aed"/>
      <rect x="43" y="43" width="14" height="14" rx="3" fill="#7c3aed"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="trail">
      <rect x="-100" y="0" width="0" height="220">
        <animate attributeName="width" values="0;1140;1140" keyTimes="0;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="220" fill="#05030a"/>

  <text x="500" y="26" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" letter-spacing="8" fill="#a78bfa" fill-opacity="0.6">WAKANDA FOREVER</text>

  <rect x="0" y="40" width="1000" height="140" fill="url(#dim)"/>

  <g clip-path="url(#trail)">
    <rect x="0" y="40" width="1000" height="140" fill="url(#lit)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="40" width="1000" height="140" fill="url(#hot)"/>
  </g>

  <!-- the panther -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-100 110;1040 110;1040 110" keyTimes="0;0.92;1" dur="9s" repeatCount="indefinite"/>
    <g filter="url(#glow)" fill="#07030d" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.5s" repeatCount="indefinite"/>

      <path d="M-40 -4 Q-72 -18 -64 -46" fill="none" stroke-width="6">
        <animateTransform attributeName="transform" type="rotate" values="-8 -40 -4;8 -40 -4;-8 -40 -4" dur="0.5s" repeatCount="indefinite"/>
      </path>

      <line x1="-28" y1="8" x2="-28" y2="30" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="-35 -28 8;35 -28 8;-35 -28 8" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-14" y1="8" x2="-14" y2="30" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="35 -14 8;-35 -14 8;35 -14 8" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="22" y1="8" x2="22" y2="30" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="35 22 8;-35 22 8;35 22 8" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="34" y1="8" x2="34" y2="30" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="-35 34 8;35 34 8;-35 34 8" dur="0.5s" repeatCount="indefinite"/>
      </line>

      <ellipse cx="0" cy="0" rx="44" ry="16"/>
      <ellipse cx="50" cy="-8" rx="16" ry="13"/>
      <polygon points="42,-17 46,-31 54,-19"/>
      <polygon points="54,-19 61,-29 63,-14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.5s" repeatCount="indefinite"/>
      <polygon points="54,-11 63,-9 55,-6" fill="#ffffff"/>
    </g>
  </g>

  <text x="500" y="204" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="6" fill="#ffffff" fill-opacity="0.35">VIBRANIUM CONTRIBUTION GRID</text>
</svg>
